<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Академия 7ЛАМП</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/><path d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/></svg>">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Firebase SDK (compat — работает без bundler) -->
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="styles-v2.css?v=2">
  <script>
    // Применяем тему до рендера, чтобы избежать мерцания
    (function() {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved ? saved : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Экран авторизации -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">
          <i data-lucide="book-open"></i>
        </div>
        <h1 class="auth-title">Академия 7ЛАМП</h1>
        <p class="auth-subtitle">Обучающая платформа компании 7Lamp</p>
      </div>
      <button id="googleSignIn" class="google-sign-in-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 2.58 9 3.58z" fill="#EA4335"/></svg>
        Войти через Google
      </button>
      <p id="authError" class="auth-error" style="display:none"></p>
    </div>
  </div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-lockup">
          <div class="brand-mark">
            <i data-lucide="book-open"></i>
          </div>
          <div class="brand-copy">
            <span class="brand-title">Академия 7ЛАМП</span>
          </div>
        </div>
        <button class="icon-btn desktop-only" id="sidebarToggle" type="button" aria-label="Свернуть панель">
          <i data-lucide="panel-left-close"></i>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebarNav" aria-label="Навигация по материалам"></nav>

      <div class="sidebar-footer">
        <div class="sidebar-footer-title">Прогресс</div>
        <div id="sidebarProgress"></div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-only" id="mobileMenuToggle" type="button" aria-label="Открыть меню">
            <i data-lucide="panel-left"></i>
          </button>
          <div class="breadcrumb" id="breadcrumb"></div>
        </div>

        <button class="icon-btn mobile-only" id="mobileSearchToggle" type="button" aria-label="Открыть поиск">
          <i data-lucide="search"></i>
        </button>

        <div class="topbar-search" id="topbarSearch">
          <button class="icon-btn mobile-only search-close-btn" id="mobileSearchClose" type="button" aria-label="Закрыть поиск">
            <i data-lucide="arrow-left"></i>
          </button>
          <label class="search-field" for="sidebarSearch">
            <i data-lucide="search"></i>
            <input id="sidebarSearch" type="search" placeholder="Поиск по материалам" autocomplete="off">
            <button class="clear-btn" id="clearSearch" type="button" aria-label="Очистить поиск">
              <i data-lucide="x"></i>
            </button>
          </label>
        </div>

        <div class="view-switch" id="viewSwitch" aria-label="Переключение вида">
          <button class="view-btn is-active" id="listViewBtn" type="button" aria-label="Список">
            <i data-lucide="list"></i>
            <span>Список</span>
          </button>
          <button class="view-btn" id="boardViewBtn" type="button" aria-label="Доска">
            <i data-lucide="layout-grid"></i>
            <span>Доска</span>
          </button>
        </div>

        <button class="icon-btn" id="themeToggle" type="button" aria-label="Переключить тему">
          <i data-lucide="moon"></i>
        </button>

        <div class="topbar-user" id="topbarUser">
          <span class="user-name" id="userName"></span>
          <img class="user-avatar" id="userAvatar" src="" alt="Аватар">
          <button class="icon-btn" id="logoutBtn" type="button" title="Выйти" aria-label="Выйти">
            <i data-lucide="log-out"></i>
          </button>
        </div>
      </header>

      <div class="reading-progress" id="readingProgress">
        <div class="reading-progress-fill" id="readingProgressFill"></div>
      </div>

      <section class="view-root" id="viewRoot" aria-live="polite">
        <div class="loading-state">Загрузка каталога...</div>
      </section>
    </main>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-btn lightbox-close" id="lightboxClose" type="button" aria-label="Закрыть изображение">
      <i data-lucide="x"></i>
    </button>
    <button class="lightbox-btn lightbox-prev" id="lightboxPrev" type="button" aria-label="Предыдущее изображение">
      <i data-lucide="chevron-left"></i>
    </button>
    <img id="lightboxImage" src="" alt="">
    <button class="lightbox-btn lightbox-next" id="lightboxNext" type="button" aria-label="Следующее изображение">
      <i data-lucide="chevron-right"></i>
    </button>
    <div class="lightbox-counter" id="lightboxCounter"></div>
  </div>

  <script src="app-v2.js"></script>
  <script src="firebase-auth.js"></script>
  <script src="firebase-progress.js"></script>
</body>
</html>
